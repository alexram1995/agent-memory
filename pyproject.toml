[project]
name = "agent-memory"
version = "0.1.0"
description = "Persistent memory orchestrator for coding agents using Ollama"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "PyYAML>=6"]

[project.scripts]
agent-memory = "agent_memory.main:main"

[tool.setuptools.packages.find]
where = ["src"]
